name: Rust Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with Rust
        run: cargo build
        working-directory: rust
      - name: Test with Rust
        run: cargo test
        working-directory: rust
